{id:'project',name:'Project Team',address:'updates@projects.example',subject:'Project update: next steps',preview:'Thanks for your input on the draft milestones...',time:'Yesterday',initial:'PT',body:'<p>Hello,</p><p>Thanks for your input on the draft milestones. We have updated the project tracker with the next steps for this week.</p><p>Best,<br>Project Team</p>'}
];
const fakeUrl='https://account-check.example/verify';
let state={phase:'outlook',selected:null,details:false,hoverLink:false,overlay:null,answered:null,toast:false,cancelled:false,notebookOpen:true,focus:'focused',history:[],timer:null};
function clearTimer(){if(state.timer){clearTimeout(state.timer);state.timer=null}}
function record(event){state.history.push(event)}
function escape(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function button(label,cls,id){return `<button type="button" class="${cls}" id="${id}">${label}</button>`}
function toolbarButton(text,id,enabled=true){return `<button class="toolbtn${id==='reportBtn'?' primary':''}" type="button" id="${id}" ${enabled?'':'disabled'}>${text}</button>`}
function outlook(){let mail=emails.find(x=>x.id===state.selected);const visible=state.focus==='focused'?emails:[];
return `<section class="app" aria-label="Email application"><header class="topbar"><div class="waffle" aria-hidden="true">▦</div><span class="appname">Mail</span><div class="search"><span aria-hidden="true">⌕</span><span>Search mail</span></div><div class="topright"><span aria-hidden="true">⚙</span><span aria-hidden="true">?</span><span class="avatar">EP</span></div></header>
<div class="toolbar">${toolbarButton('＋ New mail','newBtn')}${'<span class="divider"></span>'}${toolbarButton('↶ Reply','replyBtn',!!mail)}${toolbarButton('↪ Forward','forwardBtn',!!mail)}${toolbarButton('⚑ Report','reportBtn',!!mail)}${toolbarButton('▤ Delete','deleteBtn',!!mail)}<span class="divider"></span>${toolbarButton('··· More','moreBtn')}</div>
<div class="workspace"><nav class="rail" aria-label="App navigation"><span class="rail-icon on" title="Mail">✉</span><span class="rail-icon" title="Calendar">▦</span><span class="rail-icon" title="People">♙</span></nav><nav class="folders" aria-label="Mail folders"><div class="folder-head">Folders</div><button class="folder active" type="button">▣ Inbox <span class="count">4</span></button><button class="folder" type="button" id="draftsBtn">▤ Drafts</button><button class="folder" type="button" id="sentBtn">➤ Sent Items</button><button class="folder" type="button" id="junkBtn">◇ Junk Email</button><button class="folder" type="button" id="deletedFolder">▧ Deleted Items</button></nav>
<section class="messages" aria-label="Inbox messages"><div class="messages-title"><span>Inbox</span><span style="color:#8a99aa;font-size:14px">⌄</span></div><div class="tabs"><button type="button" data-tab="focused" class="tab ${state.focus==='focused'?'active':''}">Focused</button><button type="button" data-tab="other" class="tab ${state.focus==='other'?'active':''}">Other</button></div><div class="msglist">${visible.length?visible.map(m=>`<button type="button" data-email="${m.id}" class="mail ${state.selected===m.id?'selected':''} ${m.id==='phish'?'unread':''}" aria-label="Open email: ${escape(m.subject)} from ${escape(m.name)}"><span class="mailhead"><span class="mail-from">${escape(m.name)}</span><span class="mail-time">${escape(m.time)}</span></span><span class="mail-subject">${escape(m.subject)}</span><span class="mail-preview">${escape(m.preview)}</span></button>`).join(''):'<div class="read-empty">No messages in Other.</div>'}</div></section>
<section class="reading" aria-label="Reading pane">${!mail?'<div class="read-empty"><div style="font-size:34px">✉</div><strong>Select an email to read it</strong><br>Your messages will appear here.</div>':`<header class="read-header"><div class="read-subject">${escape(mail.subject)}</div><div class="from-row"><div class="sender-avatar">${mail.initial}</div><div class="sender-detail"><div class="sender-name">${escape(mail.name)}</div><div class="sender-address">${escape(mail.address)}</div><button class="more-details" id="detailsBtn" type="button" aria-expanded="${state.details}">${state.details?'Hide':'Show'} sender details ⌄</button></div></div>${state.details?`<div class="sender-expanded"><strong>From:</strong> ${escape(mail.name)} &lt;${escape(mail.address)}&gt;<br><strong>To:</strong> employee@company.example<br><strong>Subject:</strong> ${escape(mail.subject)}</div>`:''}<div class="read-actions">${button('↶ Reply','smallbutton','readReply')}${button('↪ Forward','smallbutton','readForward')}${button('⚑ Report','smallbutton','readReport')}</div></header><article class="mailbody">${mail.body}</article>`}</section></div>
${state.cancelled?'<div class="cancel-hint" role="status">You left the sign-in page without submitting credentials. You can still report this suspicious email using <strong>Report</strong>.</div>':''}<div class="statusbar"><span>Connected · Inbox</span>${state.hoverLink?`<span class="linkpreview">${fakeUrl}</span>`:'<span class="linkpreview">Training mailbox · Fictional messages</span>'}</div></section>`}
function browser(){let loading=state.phase==='loading';let error=state.phase==='error';return `<section class="browser" aria-label="Simulated web browser"><div class="browser-top"><button type="button" class="browser-nav" id="browserBack" aria-label="Back to email">‹</button><span class="browser-nav" aria-hidden="true">↻</span><div class="address-bar">◇ ${fakeUrl}</div><span aria-hidden="true">⋮</span></div><div class="browser-content">${loading?'<div class="login-card" role="status" aria-live="polite"><div class="loading-spinner"></div><p style="text-align:center">Signing you in…</p></div>':error?'<div class="login-card"><h2 class="login-title">We couldn’t sign you in</h2><p class="browser-warning">We couldn’t verify your account. Please try again later.</p><p class="notice">Training simulation. No credentials were submitted or transmitted.</p></div>':`<form class="login-card" id="loginForm" autocomplete="off"><div class="ms-mark"><span class="ms-logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span>Microsoft</div><h1 class="login-title">Sign in</h1><div class="login-sub">Continue to Microsoft 365</div><label class="login-label" for="fakeEmail">Email</label><input class="login-input" id="fakeEmail" type="text" value="employee@company.example" readonly tabindex="-1" autocomplete="off"><label class="login-label" for="fakePassword">Password</label><input class="login-input" id="fakePassword" type="text" value="TrainingPassword123!" readonly tabindex="-1" autocomplete="off"><div class="notice">Training simulation · Do not enter real credentials.<br>The displayed email and password are fictitious, read-only examples.</div><div class="login-actions"><button type="button" id="cancelBtn">Cancel</button><button type="button" class="blue" id="signInBtn" aria-label="Simulate sign in with fictitious credentials">Sign in</button></div></form>`}</div></section>`}
const answers=[
{label:'Report the incident immediately to the approved security / IT route.',feedback:'Correct. Treat entered credentials as a potential account compromise and report it immediately. Follow the security team’s instructions to secure the account.'},
{label:'Change my password and say nothing.',feedback:'Changing your password is a useful protective step, but it does not replace reporting. IT/Security may need to investigate sessions and other account activity.'},
{label:'Close the browser and continue working.',feedback:'Closing the page does not undo credential exposure. Report the incident promptly so your account can be protected.'},
{label:'Wait to see whether anything unusual happens.',feedback:'Waiting could give an attacker more time. Report suspected credential exposure immediately rather than waiting for signs of misuse.'}
];
function notebook(){if(state.phase==='complete')return '';if(state.notebookOpen)return `<section class="notebook open" aria-label="Scenario instructions notebook"><button type="button" class="notebook-close" id="closeNotebook" aria-label="Close notebook">✕</button><div class="notebook-label">WORKPLACE SECURITY</div><h2>Your first task</h2><p>You have just started your working day and there are several emails waiting in your inbox.</p><h3>Your objective</h3><ul><li>Review your emails and respond as you normally would at work.</li><li>Pay attention to anything that seems unusual.</li><li>Your decisions will determine what happens next.</li></ul><p class="notebook-small">Close this notebook to begin. You can reopen it at any time.</p></section>`;return `<button type="button" class="notebook closed" id="openNotebook" aria-label="Open instructions notebook"><span class="notebook-strap" aria-hidden="true"></span><span class="closed-title">Instructions</span></button>`}
function modal(){if(!state.overlay)return '';if(state.overlay==='reported')return `<div class="overlay"><section class="modal good-path" role="dialog" aria-modal="true" aria-labelledby="successTitle"><div class="success-mark">✓</div><h2 id="successTitle">You reported the suspicious email</h2><p>You avoided interacting with the suspicious link and used the approved reporting route. This helps the security team investigate and protect colleagues.</p><div class="modal-bottom">${button('Continue','continue','continueBtn')}</div></section></div>`;
return `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="decisionTitle"><h2 id="decisionTitle">You entered your credentials.</h2><p>The page was not a genuine Microsoft sign-in page. What should you do now?</p><div class="decision-options" role="group" aria-label="Choose your next action">${answers.map((a,i)=>`<button type="button" data-answer="${i}" class="answer ${state.answered===i?(i===0?'correct':'incorrect'):''}" ${state.answered!==null?'disabled':''}><span class="answer-number">${i+1}</span><span>${escape(a.label)}</span>${state.answered===i?`<span class="answer-icon" aria-label="${i===0?'Correct':'Incorrect'}">${i===0?'✓':'✕'}</span>`:''}</button>`).join('')}</div>${state.answered!==null?`<div class="feedback ${state.answered===0?'':'bad'}" role="status">${escape(answers[state.answered].feedback)}</div><div class="modal-bottom">${button('Continue','continue','continueBtn')}</div>`:''}</section></div>`}

function fitInteractivePanels(){
  // Scale the entire card, including its controls, rather than clipping its bottom.
  const pairs=[['.browser-content','.login-card'],['.overlay','.modal']];
  for(const [outerSelector,innerSelector] of pairs){
    const outer=screen.querySelector(outerSelector);
    const inner=outer?.querySelector(innerSelector);
    if(!outer||!inner)continue;
    inner.style.transform='';
    inner.style.transformOrigin='center center';
    const availableH=outer.clientHeight-(outerSelector==='.overlay'?16:12);
    const availableW=outer.clientWidth-(outerSelector==='.overlay'?16:12);
    const naturalH=inner.scrollHeight;
    const naturalW=inner.scrollWidth;
    const factor=Math.min(1,availableH/naturalH,availableW/naturalW);
    if(factor<1)inner.style.transform=`scale(${Math.max(.45,factor)})`;
  }
}
window.addEventListener('resize',()=>requestAnimationFrame(fitInteractivePanels));
function draw(){if(state.phase==='complete'){deskProps.innerHTML='';completionRoot.innerHTML=`<section class="complete" aria-label="Scenario complete"><div class="check" aria-hidden="true">✓</div><h1>Scenario complete</h1><p>Well done. You have completed this phishing awareness scenario.</p><button type="button" id="restartBtn">Try the scenario again</button></section>`;document.getElementById('restartBtn').addEventListener('click',reset);return}completionRoot.innerHTML='';screen.innerHTML=(state.phase==='outlook'?outlook():browser())+modal()+(state.toast?'<div class="mini-toast" role="status">This control is included for realism. For this scenario, choose an email and decide how to respond.</div>':'');deskProps.innerHTML=notebook();bind();requestAnimationFrame(fitInteractivePanels);if(state.overlay){let node=screen.querySelector('.modal button:not(:disabled)');if(node)node.focus()}}
function toast(){state.toast=true;draw();clearTimer();state.timer=setTimeout(()=>{state.toast=false;draw()},2600)}
function report(){if(state.selected==='phish'&&state.phase==='outlook'){record('reported suspicious email');state.overlay='reported';state.cancelled=false;draw()}else toast()}
function verify(){record('clicked suspicious link');state.phase='login';state.cancelled=false;state.hoverLink=false;draw()}
function signIn(){if(state.phase!=='login')return;record('submitted fictitious credentials');state.phase='loading';draw();clearTimer();state.timer=setTimeout(()=>{state.phase='error';draw();state.timer=setTimeout(()=>{state.overlay='decision';draw()},950)},800)}
function reset(){clearTimer();state={phase:'outlook',selected:null,details:false,hoverLink:false,overlay:null,answered:null,toast:false,cancelled:false,notebookOpen:true,focus:'focused',history:[],timer:null};draw()}
function bind(){if(state.phase==='outlook'){
screen.querySelectorAll('[data-email]').forEach(b=>b.addEventListener('click',()=>{state.selected=b.dataset.email;state.details=false;state.toast=false;state.cancelled=false;record('opened '+b.dataset.email);draw()}));
screen.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.focus=b.dataset.tab;state.selected=null;state.details=false;draw()}));
const details=document.getElementById('detailsBtn');if(details)details.addEventListener('click',()=>{state.details=!state.details;if(state.details)record('inspected sender');draw()});
const v=document.getElementById('verifyButton');if(v){v.addEventListener('click',verify);v.addEventListener('mouseenter',()=>{state.hoverLink=true;const slot=screen.querySelector('.linkpreview');if(slot)slot.textContent=fakeUrl;record('inspected link destination')});v.addEventListener('mouseleave',()=>{state.hoverLink=false;const slot=screen.querySelector('.linkpreview');if(slot)slot.textContent='Training mailbox · Fictional messages'});v.addEventListener('focus',()=>{state.hoverLink=true;const slot=screen.querySelector('.linkpreview');if(slot)slot.textContent=fakeUrl});v.addEventListener('blur',()=>{state.hoverLink=false;const slot=screen.querySelector('.linkpreview');if(slot)slot.textContent='Training mailbox · Fictional messages'})}
['reportBtn','readReport'].forEach(id=>{let b=document.getElementById(id);if(b)b.addEventListener('click',report)});
['newBtn','replyBtn','forwardBtn','deleteBtn','moreBtn','draftsBtn','sentBtn','junkBtn','deletedFolder','readReply','readForward'].forEach(id=>{let b=document.getElementById(id);if(b)b.addEventListener('click',toast)});
}else{let back=document.getElementById('browserBack');if(back)back.addEventListener('click',()=>{if(state.phase==='loading')return;state.phase='outlook';state.selected='phish';state.cancelled=true;draw()});let cancel=document.getElementById('cancelBtn');if(cancel)cancel.addEventListener('click',()=>{state.phase='outlook';state.selected='phish';state.cancelled=true;record('cancelled sign in');draw()});let form=document.getElementById('loginForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();signIn()});let signButton=document.getElementById('signInBtn');if(signButton)signButton.addEventListener('click',signIn)}
let cont=document.getElementById('continueBtn');if(cont)cont.addEventListener('click',()=>{record('completed scenario');state.phase='complete';state.overlay=null;draw()});screen.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(state.answered!==null)return;state.answered=Number(b.dataset.answer);record('decision answer '+state.answered);draw()}));let closeNote=document.getElementById('closeNotebook');if(closeNote)closeNote.addEventListener('click',()=>{state.notebookOpen=false;record('closed notebook');draw()});let openNote=document.getElementById('openNotebook');if(openNote)openNote.addEventListener('click',()=>{state.notebookOpen=true;record('opened notebook');draw()});}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.notebookOpen){state.notebookOpen=false;draw();return}if(state.phase==='login'&&!state.overlay){state.phase='outlook';state.selected='phish';state.cancelled=true;draw()}}});reset();
})();
</script>
